[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "korkutwhisper"
version = "0.1.0"
description = "Decoder-guided selective Whisper inference with CTranslate2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "av>=11", "faster-whisper==1.2.1", "ctranslate2>=4.0"]

[project.urls]
Homepage = "https://github.com/Eminkorkut/korkutWhisper"
Repository = "https://github.com/Eminkorkut/korkutWhisper"
Issues = "https://github.com/Eminkorkut/korkutWhisper/issues"
PyPI = "https://pypi.org/project/korkutwhisper/"

[project.scripts]
korkutwhisper = "korkutwhisper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"korkutwhisper.profiles" = ["*.json"]

